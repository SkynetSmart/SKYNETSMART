<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle de Producto - Skynet Smart</title>
    <link rel="shortcut icon" type="image/x-icon" href="IMAGENES/imagenes logos/logo skynet cerebro.png">
    <link rel="stylesheet" href="CSS/1practica.css">
    <link href="https://fonts.googleapis.com/css2?family=ABeeZee:ital@0;1&family=Oswald:wght@337&display=swap" rel="stylesheet">
</head>
<body>

    <!-- MODAL LIGHTBOX PARA IMAGEN EXPANDIDA -->
    <div id="modal-imagen" class="modal-oculto">
        <span class="cerrar-modal" id="btn-cerrar-modal">&times;</span>
        <img class="modal-contenido" id="img-expandida">
    </div>

    <!-- CABECERA SIMPLIFICADA (Para poder volver al catálogo) -->
    <header class="titulo" style="padding: 10px 0;">
        <div class="contenedor-buscador" style="justify-content: center;">
            <a href="index.html">
                <img src="IMAGENES/imagenes logos/logo skynet_Mesa de trabajo 6.png" class="imagen-esquina" style="width: 200px;">
            </a>
        </div>
    </header>

    <!-- EL CONTENEDOR MAESTRO DEL PRODUCTO -->
    <main class="contenedor-detalle-producto">
        <!-- Lado Izquierdo: La Foto -->
        <div class="detalle-izq">
            <!-- La caja principal nace siendo un Skeleton Gris -->
            <div class="caja-imagen-principal skeleton skel-img" id="caja-img-skeleton">
                <!-- La imagen real nace transparente (opacity: 0) -->
                <img id="prod-imagen" alt="" style="opacity: 0; transition: opacity 0.5s ease;">
            </div>
            
            <!-- Contenedor para las fotos pequeñas -->
            <div class="caja-miniaturas" id="contenedor-miniaturas"></div>
        </div>
        
        <!-- Lado Derecho: La Información -->
        <div class="detalle-der">
            <!-- Los textos nacen vacíos y con la clase Skeleton -->
            <h1 id="prod-titulo" class="skeleton skel-titulo"></h1>
            
            <p class="codigo-producto">Código: <span id="prod-codigo" class="skeleton skel-codigo"></span></p>
            
            <div class="caja-precio">
                <h2 id="prod-precio" class="skeleton skel-precio"></h2>
                <span class="iva-nota">(Precio incluye IVA)</span>
            </div>

            <div id="contenedor-alerta-stock" class="alerta-oculta">
                <span class="alerta-stock-bajo">
                    ⚠️ Pocas unidades - Consulte disponibilidad
                </span>
            </div>

            <div class="descripcion-producto">
                <h3>Características principales:</h3>
                <p id="prod-descripcion" class="skeleton skel-texto"></p>
            </div>

            

            <!-- EL BOTÓN TRANSACCIONAL -->
            <button id="btn-comprar-whatsapp" class="btn-whatsapp-gigante">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" class="bi bi-whatsapp" viewBox="0 0 16 16">
                  <path d="M13.601 2.326A7.854 7.854 0 0 0 7.994 0C3.627 0 .068 3.558.064 7.926c0 1.399.366 2.76 1.057 3.965L0 16l4.204-1.102a7.933 7.933 0 0 0 3.79.965h.004c4.368 0 7.926-3.558 7.93-7.93A7.898 7.898 0 0 0 13.6 2.326zM7.994 14.521a6.573 6.573 0 0 1-3.356-.92l-.24-.144-2.494.654.666-2.433-.156-.251a6.56 6.56 0 0 1-1.007-3.505c0-3.626 2.957-6.584 6.591-6.584a6.56 6.56 0 0 1 4.66 1.931 6.557 6.557 0 0 1 1.928 4.66c-.004 3.639-2.961 6.592-6.592 6.592zm3.615-4.934c-.197-.099-1.17-.578-1.353-.646-.182-.065-.315-.099-.445.099-.133.197-.513.646-.627.775-.114.133-.232.148-.43.05-.197-.1-.836-.308-1.592-.985-.59-.525-.985-1.175-1.103-1.372-.114-.198-.011-.304.088-.403.087-.088.197-.232.296-.346.1-.114.133-.198.198-.33.065-.134.034-.248-.015-.347-.05-.099-.445-1.076-.612-1.47-.16-.389-.323-.335-.445-.34-.114-.007-.247-.007-.38-.007a.729.729 0 0 0-.529.247c-.182.198-.691.677-.691 1.654 0 .977.71 1.916.81 2.049.098.133 1.394 2.132 3.383 2.992.47.205.84.326 1.129.418.475.152.904.129 1.246.08.38-.058 1.171-.48 1.338-.943.164-.464.164-.86.114-.943-.049-.084-.182-.133-.38-.232z"/>
                </svg>
                Comprar por WhatsApp
            </button>
        </div>

         

    </main> <!-- FIN DEL CONTENEDOR MAESTRO -->
   <!-- NUEVO: SECCIÓN DE PRODUCTOS RELACIONADOS -->
        <div class="seccion-relacionados" style="max-width: 1200px; margin: 40px auto; padding: 20px; border-top: 2px dashed #ccc;">
        <h2 style="text-align: center; color: #333; margin-bottom: 25px; font-family: 'Oswald', sans-serif;">También te podría interesar</h2>
        
        <!-- ETIQUETA LIMPIA: Sin clases heredadas ni estilos en línea -->
        <section id="contenedor-relacionados">
            <!-- Los productos se inyectarán aquí por JavaScript -->
        </section>
    </div>

    <!-- EL PIE DE PÁGINA (Sin cambios) -->
    <footer class="footer">
        <article>
            <p> Manuel Vega 7-32, Cuenca</p>
            <p> (07) 282-4240 / 098 802 4097</p>
            <p> ventas@skynetsmart.com.ec </p>
        </article>
    </footer>

    <!-- TU SCRIPT QUE LE DARÁ VIDA -->
    <script type="module" src="JS/detalle_producto.js"></script>
</body>
</html>
